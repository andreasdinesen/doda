gameskill:
  id: doda
  name: doda
  category: Apps
  description: Personlig opgave- og noteapp efter GTD-metoden. Lynhurtig fangst fra et enkelt soegefelt, inbox med tastaturafklaring,
    naeste-handlings-liste efter kontekst, projekter og omraader, markdown-noter, gentagende opgaver med Todoist-syntaks,
    ugentlig gennemgang, kalenderfeed og et API til iOS Shortcuts og Siri. Egen SQLite-database, ingen eksterne afhaengigheder.
  author: andreas
  version: 20
  icon: app
  docker:
    image: '{{NODE_IMAGE}}'
  variables:
  - key: APP_NAME
    name: Appens navn
    type: string
    default: doda
  - key: NODE_IMAGE
    name: Node-image
    type: string
    default: node:24-alpine
    pattern: ^node:[0-9][A-Za-z0-9._-]*$
    hint: Skal vaere et node:-image, fx node:24-alpine eller node:24.9.0-alpine
  install:
    image: '{{NODE_IMAGE}}'
    script: 'set -eu

      echo "Installerer doda v20 ..."

      echo "Node: $(node --version)"


      # App-filerne ligger som brotli-komprimeret tar i base85 - se build_rune.py

      node -e ''const A=[];for(let c=33;c<127;c++)if(c!==123&&c!==125&&c!==92)A.push(c);const M=new Int16Array(128).fill(-1);for(let
      i=0;i<85;i++)M[A[i]]=i;const s=require("fs").readFileSync(0,"utf8").replace(/\s+/g,"");const h=s.length/5|0,r=s.length%5,o=Buffer.alloc(h*4+(r?r-1:0));let
      q=0;for(let i=0;i<h;i++){let v=0;for(let j=0;j<5;j++)v=v*85+M[s.charCodeAt(q++)];o.writeUInt32BE(v>>>0,i*4);}if(r){let
      v=0;for(let j=0;j<5;j++)v=v*85+(j<r?M[s.charCodeAt(q+j)]:84);const b=Buffer.alloc(4);b.writeUInt32BE(v>>>0);b.copy(o,h*4,0,r-1);}process.stdout.write(require("zlib").brotliDecompressSync(o));''
      <<''YGG_PAYLOAD_EOF'' | tar x

