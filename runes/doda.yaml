gameskill:
  id: doda
  name: doda
  category: Apps
  description: Personlig opgave- og noteapp efter GTD-metoden. Lynhurtig fangst fra et enkelt soegefelt, inbox med tastaturafklaring,
    naeste-handlings-liste efter kontekst, projekter og omraader, markdown-noter, gentagende opgaver med Todoist-syntaks,
    ugentlig gennemgang, kalenderfeed og et API til iOS Shortcuts og Siri. Egen SQLite-database, ingen eksterne afhaengigheder.
  author: andreas
  version: 83
  icon: app
  docker:
    image: '{{NODE_IMAGE}}'
  variables:
  - key: APP_NAME
    name: Appens navn
    type: string
    default: doda
  - key: NODE_IMAGE
    name: Node-image
    type: string
    default: node:24-alpine
    pattern: ^node:[0-9][A-Za-z0-9._-]*$
    hint: Skal vaere et node:-image, fx node:24-alpine eller node:24.9.0-alpine
  - key: KODE_VERSION
    name: Kodeversion
    type: string
    default: ''
    pattern: ^([0-9]+|seneste|latest)?$
    hint: Tom = hent nyeste udgivelse fra GitHub ved hver genstart. Et tal (fx 81) laaser til praecis den udgave.
  install:
    image: '{{NODE_IMAGE}}'
    script: "set -eu\necho \"Installerer doda (startsnor v83) ...\"\necho \"Node: $(node --version)\"\n\necho \"Henter app-koden\
      \ fra GitHub ...\"\nrm -rf /tmp/doda-hent\nmkdir -p /tmp/doda-hent\nnode -e 'const https=require(\"https\"),zlib=require(\"\
      zlib\");const U=\"https://codeload.github.com/andreasdinesen/doda/tar.gz/refs/tags/v83\";function d(m){console.error(\"\
      [fejl] \"+m);console.error(\"Adresse: \"+U);console.error(\"Repoet er offentligt, saa en 404 betyder, at adressen ikke\
      \ findes - tjek at taggen er pushet.\");process.exit(1);}function hent(u,n){const h={\"user-agent\":\"doda-installer\"\
      };https.get(u,{headers:h},(r)=>{if(r.statusCode>=300&&r.statusCode<400&&r.headers.location){if(n<=0)return d(\"for mange\
      \ omdirigeringer\");r.resume();return hent(new URL(r.headers.location,u).toString(),n-1);}if(r.statusCode!==200)return\
      \ d(\"GitHub svarede \"+r.statusCode);const g=zlib.createGunzip();g.on(\"error\",(e)=>d(\"arkivet kunne ikke pakkes\
      \ ud: \"+e.message));r.pipe(g).pipe(process.stdout);}).on(\"error\",(e)=>d(\"kunne ikke naa GitHub: \"+e.message));}hent(U,3);'\
      \ > /tmp/doda-hent/app.tar\ntar x -C /tmp/doda-hent -f /tmp/doda-hent/app.tar\n\n# Mappenavnet i et GitHub-arkiv er\
      \ <repo>-<ref uden v>, og arkivet\n# begynder med en pax_global_header-post. Ingen af delene gaettes:\n# find den app-mappe,\
      \ der FINDES.\nNY=$(find /tmp/doda-hent -maxdepth 2 -type d -name app | head -n 1)\nif [ -z \"$NY\" ] || [ ! -f \"$NY/server.js\"\
      \ ]; then\n  echo \"[fejl] arkivet fra GitHub indeholder ingen app/server.js\"\n  exit 1\nfi\nrm -rf app\nmv \"$NY\"\
      \ app\nrm -rf /tmp/doda-hent\n\necho \"Filer udpakket:\"\nls -1 app app/public\necho \"Klar. Start serveren i panelet\
      \ - den henter selv nyeste\"\necho \"udgave (eller den, KODE_VERSION laaser til), foer den starter.\"\n"
  update:
    image: '{{NODE_IMAGE}}'
    label: Opdater doda
    script: "set -eu\necho \"Opdaterer doda ...\"\necho \"Node: $(node --version)\"\n\nif [ -f app/kilde.js ]; then\n  K=\"\
      {{KODE_VERSION}}\"\n  case \"$K\" in\n    '') : ;;\n    seneste|latest|[0-9]*) : ;;\n    *) K=\"${KODE_VERSION:-}\"\
      \ ;;\n  esac\n  echo \"Oensket udgave: ${K:-nyeste}\"\n  KODE_VERSION=\"$K\" node app/kilde.js\nelse\n  echo \"Henter\
      \ app-koden fra GitHub ...\"\n  rm -rf /tmp/doda-hent\n  mkdir -p /tmp/doda-hent\n  node -e 'const https=require(\"\
      https\"),zlib=require(\"zlib\");const U=\"https://codeload.github.com/andreasdinesen/doda/tar.gz/refs/tags/v83\";function\
      \ d(m){console.error(\"[fejl] \"+m);console.error(\"Adresse: \"+U);console.error(\"Repoet er offentligt, saa en 404\
      \ betyder, at adressen ikke findes - tjek at taggen er pushet.\");process.exit(1);}function hent(u,n){const h={\"user-agent\"\
      :\"doda-installer\"};https.get(u,{headers:h},(r)=>{if(r.statusCode>=300&&r.statusCode<400&&r.headers.location){if(n<=0)return\
      \ d(\"for mange omdirigeringer\");r.resume();return hent(new URL(r.headers.location,u).toString(),n-1);}if(r.statusCode!==200)return\
      \ d(\"GitHub svarede \"+r.statusCode);const g=zlib.createGunzip();g.on(\"error\",(e)=>d(\"arkivet kunne ikke pakkes\
      \ ud: \"+e.message));r.pipe(g).pipe(process.stdout);}).on(\"error\",(e)=>d(\"kunne ikke naa GitHub: \"+e.message));}hent(U,3);'\
      \ > /tmp/doda-hent/app.tar\n  tar x -C /tmp/doda-hent -f /tmp/doda-hent/app.tar\n\n  # Mappenavnet i et GitHub-arkiv\
      \ er <repo>-<ref uden v>, og arkivet\n  # begynder med en pax_global_header-post. Ingen af delene gaettes:\n  # find\
      \ den app-mappe, der FINDES.\n  NY=$(find /tmp/doda-hent -maxdepth 2 -type d -name app | head -n 1)\n  if [ -z \"$NY\"\
      \ ] || [ ! -f \"$NY/server.js\" ]; then\n    echo \"[fejl] arkivet fra GitHub indeholder ingen app/server.js\"\n   \
      \ exit 1\n  fi\n  rm -rf app\n  mv \"$NY\" app\n  rm -rf /tmp/doda-hent\nfi\n\necho \"App-filerne er skiftet ud. Databasen\
      \ i /data er uroert.\"\necho \"Genstart doda, saa serveren koerer den nye kode.\"\n"
  startup:
    command: "if [ ! -f app/server.js ] && [ -f .doda-gammel/server.js ]; then\n  rm -rf app\n  mv .doda-gammel app\n  echo\
      \ \"[kode] app/ sat tilbage efter en afbrudt udskiftning\"\nfi\nnode app/kilde.js || echo \"[kode] advarsel: opdateringen\
      \ kunne ikke koeres\"\nif node -e \"require('node:sqlite')\" >/dev/null 2>&1; then\n  exec node app/server.js\nelse\n\
      \  exec node --experimental-sqlite app/server.js\nfi\n"
    done_regex: doda lytter
    stop_timeout: 30
  ports:
  - name: web
    default: 3000
    protocol: tcp
  watchers:
  - name: Serverfejl i doda
    pattern: \[fejl\]
    threshold: 5
    window_secs: 300
  events:
  - key: doda_login_fejl
    label: Mislykket login i doda
    match: \[sikkerhed\] login-fejl ip=(\S+)
  - key: doda_login_spaerret
    label: Login spaerret af rate-limit
    match: \[sikkerhed\] login-spaerret ip=(\S+)
  backup:
    include: []
  wipe:
    paths:
    - doda.db
    - doda.db-wal
    - doda.db-shm
    - files
    backup_first: true
