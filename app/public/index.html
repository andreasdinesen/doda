<!doctype html>
<html lang="da" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>doda</title>
<link rel="manifest" href="manifest.webmanifest">
<script data-theme-init>try{var t=localStorage.getItem('doda_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<div id="root" aria-live="polite"></div>
<div class="toasts" id="toasts"></div>

<script src="app.js?v=1"></script>
</body>
</html>
